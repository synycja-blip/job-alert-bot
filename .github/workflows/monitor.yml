name: Check for new jobs

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:          # lets you press "Run workflow" by hand
  workflow_run:               # also run right after company discovery finishes
    workflows: ["Discover companies"]
    types: [completed]

permissions:
  contents: write             # needed to save data/state.json (which jobs were already sent)

concurrency:
  group: job-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check job boards and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.monitor

      - name: Save memory of sent jobs
        if: always()
        run: |
          git config user.name  "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          [ -f data/state.json ] || exit 0
          git add data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update job state [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
